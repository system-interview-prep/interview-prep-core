services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-interview_password}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-db:
    image: paradedb/paradedb:0.25.3-pg16@sha256:a40200f412a0384d2d04c5a1d7cde554d346cb1109b37acf6385ba4c119e2c5f
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: matching_db
    ports: ["${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d matching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-interview}:${RABBITMQ_PASSWORD:-interview_password}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-interview}:${RABBITMQ_PASSWORD:-interview_password}@rabbitmq:5672/
      DATABASE_URL: postgresql://user:password@postgres-db:5432/matching_db
      # The voice agent runs as its own service (voice-agent below): a child of
      # this --reload API process was killed, with every live call, on each
      # code save. Forced off here because .env may still set it to true.
      LIVEKIT_AGENT_AUTOSTART: "false"
      LIVEKIT_AGENT_RUN_MODE: ${LIVEKIT_AGENT_RUN_MODE:-dev}
      LIVEKIT_STT_MODEL: ${LIVEKIT_STT_MODEL:-assemblyai/universal-3-6-pro}
      # Interviews are Vietnamese-only: never auto-detect the language.
      LIVEKIT_STT_LANGUAGE: "vi"
      VOICE_LAB_STT_LANGUAGE: ${VOICE_LAB_STT_LANGUAGE:-vi}
      # Docker Desktop on Windows/macOS needs polling to reliably notice bind-mounted edits.
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["5000:5000"]
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn src.main:asgi_app --host 0.0.0.0 --port 5000 --reload --reload-dir /app/src"]
    volumes: ["./src:/app/src", "./tests:/app/tests", "./migrations:/app/migrations", "./trace-logs:/app/trace-logs", "./alembic.ini:/app/alembic.ini:ro", "./pyproject.toml:/app/pyproject.toml:ro"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  voice-agent:
    # LiveKit voice interview agent. Separate from the API so a backend reload
    # does not drop live calls. It does not hot-reload: restart this service
    # after changing src/modules/interviews/adapters/voice/*.
    # Reuses the backend image (same api target) instead of building a second one.
    image: interview-prep-core-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      VOICE_RUNTIME_API_BASE_URL: http://backend:5000
      LIVEKIT_AGENT_MAX_RETRY: ${LIVEKIT_AGENT_MAX_RETRY:-32}
      LIVEKIT_STT_MODEL: ${LIVEKIT_STT_MODEL:-assemblyai/universal-3-6-pro}
      # Interviews are Vietnamese-only: never auto-detect the language.
      LIVEKIT_STT_LANGUAGE: "vi"
      VOICE_LAB_STT_LANGUAGE: ${VOICE_LAB_STT_LANGUAGE:-vi}
    working_dir: /app/src/modules
    command: ["python", "interviews/adapters/voice/livekit_agent.py", "start"]
    volumes: ["./src:/app/src"]
    # Docker Desktop's embedded resolver has intermittently failed during live
    # calls. Keep explicit, configurable upstream resolvers for this
    # internet-facing worker; Docker still resolves internal service names.
    dns:
      - ${VOICE_AGENT_DNS_PRIMARY:-1.1.1.1}
      - ${VOICE_AGENT_DNS_SECONDARY:-8.8.8.8}
    dns_opt:
      - timeout:2
      - attempts:3
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}

  voice-eval:
    profiles: ["tools"]
    image: interview-prep-core-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
    working_dir: /app
    command: ["python", "scripts/transcribe_vi_stt_corpus.py", "--help"]
    volumes:
      - "./src:/app/src:ro"
      - "./scripts:/app/scripts:ro"
      - "../DOC_AND_PLAN/data/eval/stt:/eval/stt"
    dns:
      - ${VOICE_AGENT_DNS_PRIMARY:-1.1.1.1}
      - ${VOICE_AGENT_DNS_SECONDARY:-8.8.8.8}
    dns_opt:
      - timeout:2
      - attempts:3

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-interview}:${RABBITMQ_PASSWORD:-interview_password}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-interview}:${RABBITMQ_PASSWORD:-interview_password}@rabbitmq:5672/
      DATABASE_URL: postgresql://user:password@postgres-db:5432/matching_db
    command: ["celery", "-A", "src.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--queues=celery,cv-processing,jd-processing,matching"]
    volumes: ["./src:/app/src", "./tests:/app/tests", "./trace-logs:/app/trace-logs", "./pyproject.toml:/app/pyproject.toml:ro"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres-db: {condition: service_healthy}
      backend: {condition: service_healthy}

volumes:
  rabbitmq_data:
  pgdata:
